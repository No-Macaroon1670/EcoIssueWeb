<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Environmental issue web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <header class="brand">
      <h1>Environmental issue web</h1>
      <p class="tagline">How the problems connect, and what the connections are called.</p>
    </header>

    <div class="control">
      <label class="control-label" for="search">Find an issue</label>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="permafrost, plastic, drought…" autocomplete="off" spellcheck="false">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
    </div>

    <div class="control">
      <span class="control-label">Link weights from</span>
      <div class="segmented" role="radiogroup" aria-label="Weight source">
        <button class="seg active" data-weights="editorial" role="radio" aria-checked="true">My judgement</button>
        <button class="seg" data-weights="readers" role="radio" aria-checked="false">Readers</button>
      </div>
      <p id="weights-note" class="control-hint"></p>
    </div>

    <div class="control">
      <span class="control-label">Colour by</span>
      <div class="segmented" role="radiogroup" aria-label="Colour by">
        <button class="seg active" data-colour="cat" role="radio" aria-checked="true">Category</button>
        <button class="seg" data-colour="cluster" role="radio" aria-checked="false">Detected cluster</button>
      </div>
      <p id="cluster-note" class="control-hint"></p>
    </div>

    <div class="control">
      <label class="control-label" for="slider-links">Strongest links only</label>
      <input type="range" id="slider-links" min="5" max="100" step="5" value="100">
      <p id="links-note" class="control-hint"></p>
    </div>

    <div class="control">
      <label class="control-label" for="slider-degree">Minimum connections</label>
      <input type="range" id="slider-degree" min="0" max="10" step="1" value="0">
      <p id="degree-note" class="control-hint"></p>
    </div>

    <div class="control">
      <label class="check"><input type="checkbox" id="opt-loops"> Highlight feedback loops</label>
      <p id="loop-note" class="control-hint"></p>
      <label class="check"><input type="checkbox" id="opt-solutions"> Show solutions layer</label>
      <label class="check"><input type="checkbox" id="opt-group" checked> Pull groups apart on screen</label>
      <label class="check"><input type="checkbox" id="opt-verbs"> Show every verb at once</label>
    </div>

    <div class="control">
      <span class="control-label" id="legend-title">Categories</span>
      <ul class="legend" id="legend"></ul>
    </div>

    <div class="control">
      <label class="control-label" for="place">Assess for a place</label>
      <select id="place">
        <option value="">— none —</option>
        <option value="__custom__">Describe my area…</option>
      </select>
      <button type="button" id="map-toggle" class="linkish" aria-expanded="false">
        Pick on a map
      </button>
      <div id="map-panel" class="map-panel" hidden></div>
      <label class="check" id="local-focus-wrap" hidden>
        <input type="checkbox" id="opt-local-focus"> Local focus — fade what does not feed this place
      </label>
      <fieldset id="custom-profile" class="custom" hidden>
        <legend>My area</legend>
        <label class="control-label" for="custom-income">Income group</label>
        <select id="custom-income"></select>
        <span class="control-label">Geography</span>
        <div id="custom-flags" class="flag-grid"></div>
      </fieldset>
      <div id="local-top" class="local-top"></div>
    </div>

    <footer class="sidebar-foot">
      <button class="btn" id="btn-table">Table view</button>
      <button class="btn" id="btn-theme" title="Switch theme">Theme: auto</button>
    </footer>
  </aside>

  <main class="stage">
    <canvas id="graph" aria-label="Network of environmental issues. Use the table view for a non-visual equivalent."></canvas>
    <div class="stage-tools">
      <button class="tool" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="tool" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="tool wide" id="btn-fit" title="Fit everything in view">Fit</button>
    </div>
    <div class="stage-key">
      <span><span class="key-line solid"></span>drives</span>
      <span><span class="key-line dashed"></span>suppresses</span>
      <span id="key-lever" hidden><span class="key-ring"></span>lever</span>
    </div>
  </main>

  <aside class="detail" id="detail" tabindex="-1"></aside>
</div>

<script src="data/schema.js"></script>
<script src="data/nodes-a.js"></script>
<script src="data/nodes-b.js"></script>
<script src="data/nodes-c.js"></script>
<script src="data/solutions.js"></script>
<script src="data/links.js"></script>
<script src="data/links-c.js"></script>
<script src="data/keywords.js"></script>
<script src="data/weights-clickstream.js"></script>
<script src="data/regions.js"></script>
<script src="data/world.js"></script>
<script src="src/cluster.js"></script>
<script src="src/loops.js"></script>
<script src="src/layout.js"></script>
<script src="src/graph.js"></script>
<script src="src/locale.js"></script>
<script src="src/map.js"></script>
<script src="src/panel.js"></script>
<script src="src/app.js"></script>
</body>
</html>
